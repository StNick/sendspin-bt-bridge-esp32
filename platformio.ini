; Sendspin Bluetooth Bridge for ESP32-S31
;
; ESP32-S31 support exists only in the community "pioarduino" platform (the upstream
; platformio/platform-espressif32 has no S31 target). 61.04.00-RC1 is the first pioarduino
; release that ships ESP-IDF 6.1.0, the first ESP-IDF with ESP32-S31 support. The URL is pinned
; so a rebuild uses exactly this platform; bump it deliberately.

[platformio]
default_envs = esp32-s31

[env:esp32-s31]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/61.04.00-RC1/platform-espressif32.zip
framework = espidf
extra_scripts = pre:scripts/check_ldac_overlay.py
; Espressif ESP32-S31-Function-CoreBoard-1: 16 MB quad flash, 16 MB octal PSRAM.
; For another S31 board, pick its board file or override flash size below and in
; sdkconfig.defaults (CONFIG_ESPTOOLPY_FLASHSIZE_*). The partition table fits 8 MB flash.
board = esp32-s31-coreboard-1
board_build.partitions = partitions.csv
; The web UI page is compiled into the firmware (see src/CMakeLists.txt EMBED_TXTFILES).
board_build.embed_txtfiles =
    src/web/index.html
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
